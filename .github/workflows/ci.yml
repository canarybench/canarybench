name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and public test/lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest hypothesis ruff mypy mypy-extensions lxml-stubs build

      - name: Lint public code and tests
        run: ruff check src tests

      - name: Strict type-check public package and public tests
        run: >
          mypy --strict src
          tests/test_schemas_and_decimal.py
          tests/test_cli_and_grading.py
          tests/test_packaging_isolation.py

      - name: Run public test suite
        run: >
          pytest -v
          tests/test_schemas_and_decimal.py
          tests/test_cli_and_grading.py
          tests/test_packaging_isolation.py

      - name: Test clean wheel install in isolated venv
        run: |
          python -m build --wheel --outdir /tmp/dist
          python -m venv /tmp/clean-venv
          /tmp/clean-venv/bin/pip install /tmp/dist/canarybench-*.whl
          cd /tmp
          /tmp/clean-venv/bin/canarybench list-engines
          /tmp/clean-venv/bin/canarybench list-packs
          /tmp/clean-venv/bin/canarybench run --pack eu-vat-2027 --baseline-mock naive
