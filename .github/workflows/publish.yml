name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff mypy lxml-stubs build

      - name: Verify public lint, types, and isolation tests
        run: |
          ruff check src tests
          mypy --strict src tests/test_schemas_and_decimal.py tests/test_cli_and_grading.py tests/test_packaging_isolation.py
          pytest -v tests/test_schemas_and_decimal.py tests/test_cli_and_grading.py tests/test_packaging_isolation.py

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Assert zero private paths in built archives
        run: |
          python - <<'PY'
          import pathlib, tarfile, zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1

          with zipfile.ZipFile(wheels[0]) as zf:
              leaks = [n for n in zf.namelist() if "private" in n.lower()]
              assert not leaks, f"private leaked into wheel: {leaks}"

          with tarfile.open(sdists[0], "r:gz") as tf:
              leaks = [m for m in tf.getnames() if "/private" in m or m.startswith("private")]
              assert not leaks, f"private leaked into sdist: {leaks}"
          print("Verified zero private leakage in sdist and wheel.")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish:
    name: Publish canarybench to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canarybench
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
