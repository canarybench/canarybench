name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Verify and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package and public verification tools
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e . pytest ruff mypy lxml-stubs build

      - name: Verify public lint, types, and isolation tests
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/mypy --strict src tests/test_schemas_and_decimal.py tests/test_cli_and_grading.py tests/test_packaging_isolation.py
          .venv/bin/pytest -v tests/test_schemas_and_decimal.py tests/test_cli_and_grading.py tests/test_packaging_isolation.py

      - name: Build sdist and wheel with uv
        run: uv build --out-dir dist

      - name: Assert zero private leakage in sdist and wheel
        run: |
          .venv/bin/python - <<'PY'
          import pathlib, tarfile, zipfile

          dist = pathlib.Path("dist")
          wheels = list(dist.glob("*.whl"))
          sdists = list(dist.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1

          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
              leaks = [n for n in names if "private" in n.lower()]
              assert not leaks, f"private leaked into wheel: {leaks}"
              for pkg_dir, manifest in (
                  ("eu_vat_2027", "public_25.jsonl"),
                  ("cre_lease", "public_10.jsonl"),
                  ("customs_cbam", "public_10.jsonl"),
                  ("med_coding", "public_10.jsonl"),
                  ("claims_adjudication", "public_10.jsonl"),
              ):
                  assert any(n.endswith(f"canarybench/packs/{pkg_dir}/data/{manifest}") for n in names)

          with tarfile.open(sdists[0], "r:gz") as tf:
              leaks = [m for m in tf.getnames() if "/private" in m or m.startswith("private")]
              assert not leaks, f"private leaked into sdist: {leaks}"
          print("Verified zero private leakage and complete 5-pack data in sdist and wheel.")
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  publish:
    name: Publish canarybench to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/canarybench
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish package to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
